name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # required for OIDC
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dockerfile.lambda's final stage is arm64 and runs apk (poppler-utils);
      # emulate arm64 so the image builds on this amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-brokers-sync
          aws-region: eu-central-1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Build web
        run: cd web && npm ci && npm run build

      - name: CDK Bootstrap
        run: make cdk-bootstrap AWS_PROFILE=

      - name: CDK Deploy
        run: make cdk-deploy AWS_PROFILE=

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdk-outputs
          path: infra/cdk-outputs.json
